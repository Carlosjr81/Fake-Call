name: Compilar e conferir
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-phone.txt
      - name: API, áudio e telefonia simulada, sem ligações reais
        run: python -m unittest discover -s tests -v
      - name: Processamento de áudio
        run: bash tests/run-audio.sh
      - name: APK e análise Android
        working-directory: android
        run: bash gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fake-Call-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
